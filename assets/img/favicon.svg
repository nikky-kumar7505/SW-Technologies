<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SW Technologies favicon">
  <defs>
    <linearGradient id="g" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="t" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7fff8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="textShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#061022" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#g)" filter="url(#soft)"/>

  <!-- Dark glass layer for contrast -->
  <rect x="9" y="9" width="46" height="46" rx="15" fill="rgba(7,12,22,.24)"/>
  <rect x="9.5" y="9.5" width="45" height="45" rx="14.5" fill="none" stroke="rgba(255,255,255,.14)"/>
  <path d="M13 18c8-8 30-8 38 0" fill="none" stroke="rgba(255,255,255,.10)" stroke-linecap="round"/>

  <!-- "SW" monogram -->
  <text
    x="32"
    y="40"
    text-anchor="middle"
    font-size="26"
    font-weight="900"
    font-family="Poppins, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
    letter-spacing="0.9"
    fill="url(#t)"
    filter="url(#textShadow)"
  >SW</text>
</svg>
